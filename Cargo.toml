[package]
name = "smspool"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Async Rust SDK for the SMSPool API"
license = "Apache-2.0"
readme = "README.md"
keywords = ["smspool", "sms", "otp", "api-client", "async"]
categories = ["api-bindings", "asynchronous"]
repository = "https://github.com/z23cc/smspool-sdk"
# `documentation` is intentionally unset: crates.io defaults it to docs.rs,
# which is the correct target once published.
autoexamples = false
exclude = [
    "/_git_data",
    "/prompt-exports",
    "/acceptance",
    "/contracts",
    "/scripts",
    "/docs",
    "/tests",
    "/postman.json",
]

# docs.rs bakes this into the published version and cannot be changed afterwards.
# Build with `tracing` so those items appear, but never with `postgres-example`:
# that feature is example-only and its sqlx dependency requires a much newer
# toolchain than the library itself.
[package.metadata.docs.rs]
features = ["tracing"]
all-features = false

[features]
default = ["rustls-tls"]
rustls-tls = ["reqwest/rustls"]
tracing = ["dep:tracing"]
postgres-example = [
    "dep:axum",
    "dep:chacha20poly1305",
    "dep:hex",
    "dep:sha2",
    "dep:sqlx",
]

[dependencies]
futures-util = "=0.3.34"
http = "=1.5.0"
httpdate = "=1.0.3"
rand = "=0.10.2"
# reqwest 0.13 split `form` and `query` out of the default set and renamed the
# rustls feature; all four are used by the transport.
reqwest = { version = "=0.13.4", default-features = false, features = ["form", "multipart", "query", "stream"] }
rust_decimal = "=1.42.1"
secrecy = "=0.10.3"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
serde_path_to_error = "=0.1.20"
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", features = ["macros", "net", "rt", "signal", "sync", "time"] }
tokio-util = { version = "=0.7.19", features = ["rt"] }
tracing = { version = "=0.1.44", optional = true }
url = "=2.5.8"
axum = { version = "=0.8.9", optional = true }
chacha20poly1305 = { version = "=0.11.0", optional = true }
hex = { version = "=0.4.3", optional = true }
sha2 = { version = "=0.11.0", optional = true }
sqlx = { version = "=0.9.0", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls-ring"], optional = true }

[dev-dependencies]
tokio = { version = "=1.53.1", features = ["io-util"] }
tracing-subscriber = "=0.3.23"

[[example]]
name = "axum"
required-features = ["postgres-example"]
