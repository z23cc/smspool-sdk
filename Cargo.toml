[package]
name = "smspool"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Async Rust SDK for the SMSPool API"
license = "MIT OR Apache-2.0"
autoexamples = false

[features]
default = ["rustls-tls"]
rustls-tls = ["reqwest/rustls-tls"]
tracing = ["dep:tracing"]
postgres-example = [
    "dep:axum",
    "dep:chacha20poly1305",
    "dep:hex",
    "dep:sha2",
    "dep:sqlx",
]

[dependencies]
futures-util = "=0.3.31"
http = "=1.3.1"
httpdate = "=1.0.3"
rand = "=0.9.2"
reqwest = { version = "=0.12.23", default-features = false, features = ["multipart", "stream"] }
rust_decimal = "=1.37.2"
secrecy = "=0.8.0"
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.143"
serde_path_to_error = "=0.1.17"
thiserror = "=2.0.16"
tokio = { version = "=1.47.1", features = ["macros", "net", "rt", "signal", "sync", "time"] }
tokio-util = { version = "=0.7.16", features = ["rt"] }
tracing = { version = "=0.1.41", optional = true }
url = "=2.5.4"
axum = { version = "=0.8.4", optional = true }
chacha20poly1305 = { version = "=0.10.1", optional = true }
hex = { version = "=0.4.3", optional = true }
sha2 = { version = "=0.10.9", optional = true }
sqlx = { version = "=0.8.3", default-features = false, features = ["postgres", "runtime-tokio-rustls"], optional = true }

[dev-dependencies]
tokio = { version = "=1.47.1", features = ["io-util"] }
tracing-subscriber = "=0.3.20"

[[example]]
name = "axum"
required-features = ["postgres-example"]
